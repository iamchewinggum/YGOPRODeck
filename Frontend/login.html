<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YGOPRODeck — Enter the Duel</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #c9a84c;
    --gold-light: #e8c96d;
    --gold-dim: #7a5f2a;
    --black: #050403;
    --dark: #0d0b08;
    --surface: #13110d;
    --surface2: #1c1812;
    --text: #e8dcc8;
    --text-dim: #8a7a5e;
    --red: #8b1a1a;
    --error: #c0392b;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--black);
    color: var(--text);
    font-family: 'Crimson Pro', serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 80% 60% at 50% 0%, rgba(201,168,76,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 20% 80%, rgba(139,26,26,0.06) 0%, transparent 50%),
      radial-gradient(ellipse 60% 40% at 80% 90%, rgba(201,168,76,0.04) 0%, transparent 50%);
    pointer-events: none;
  }

  /* Eye of Ra background symbol */
  body::after {
    content: '𓂀';
    position: fixed;
    font-size: 40vw;
    opacity: 0.015;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    line-height: 1;
  }

  .container {
    width: 100%;
    max-width: 440px;
    padding: 2rem;
    position: relative;
    z-index: 1;
    animation: fadeUp 0.8s ease forwards;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  .logo-symbol {
    font-size: 3rem;
    display: block;
    margin-bottom: 0.5rem;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.7; text-shadow: 0 0 20px rgba(201,168,76,0.3); }
    50% { opacity: 1; text-shadow: 0 0 40px rgba(201,168,76,0.6); }
  }

  .logo h1 {
    font-family: 'Cinzel', serif;
    font-size: 1.8rem;
    font-weight: 900;
    color: var(--gold);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .logo p {
    font-size: 0.85rem;
    color: var(--text-dim);
    letter-spacing: 0.3em;
    text-transform: uppercase;
    margin-top: 0.3rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid rgba(201,168,76,0.2);
    border-radius: 2px;
    padding: 2.5rem;
    position: relative;
    box-shadow: 0 0 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(201,168,76,0.1);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  /* Tab switcher */
  .tabs {
    display: flex;
    margin-bottom: 2rem;
    border-bottom: 1px solid rgba(201,168,76,0.15);
  }

  .tab {
    flex: 1;
    padding: 0.75rem;
    background: none;
    border: none;
    color: var(--text-dim);
    font-family: 'Cinzel', serif;
    font-size: 0.8rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    position: relative;
  }

  .tab.active {
    color: var(--gold);
  }

  .tab.active::after {
    content: '';
    position: absolute;
    bottom: -1px; left: 0; right: 0;
    height: 2px;
    background: var(--gold);
  }

  .tab:hover:not(.active) { color: var(--text); }

  /* Forms */
  .form { display: none; }
  .form.active { display: block; }

  .field {
    margin-bottom: 1.25rem;
  }

  .field label {
    display: block;
    font-family: 'Cinzel', serif;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 0.5rem;
  }

  .field input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 2px;
    padding: 0.8rem 1rem;
    color: var(--text);
    font-family: 'Crimson Pro', serif;
    font-size: 1rem;
    transition: all 0.3s;
    outline: none;
  }

  .field input:focus {
    border-color: rgba(201,168,76,0.5);
    box-shadow: 0 0 0 3px rgba(201,168,76,0.05);
  }

  .field input::placeholder { color: var(--text-dim); opacity: 0.5; }

  .btn {
    width: 100%;
    padding: 0.9rem;
    background: linear-gradient(135deg, var(--gold-dim), var(--gold));
    border: none;
    border-radius: 2px;
    color: var(--black);
    font-family: 'Cinzel', serif;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
    margin-top: 0.5rem;
    position: relative;
    overflow: hidden;
  }

  .btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.15), transparent);
    transform: translateX(-100%);
    transition: transform 0.4s;
  }

  .btn:hover::after { transform: translateX(100%); }
  .btn:hover { box-shadow: 0 0 20px rgba(201,168,76,0.3); }
  .btn:active { transform: scale(0.99); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .error-msg {
    background: rgba(192,57,43,0.1);
    border: 1px solid rgba(192,57,43,0.3);
    border-radius: 2px;
    padding: 0.75rem 1rem;
    color: #e74c3c;
    font-size: 0.9rem;
    margin-bottom: 1rem;
    display: none;
  }

  .error-msg.show { display: block; }

  .divider {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.75rem;
    letter-spacing: 0.2em;
    margin: 2rem 0 1rem;
    position: relative;
  }

  .divider::before, .divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: 40%;
    height: 1px;
    background: rgba(201,168,76,0.1);
  }

  .divider::before { left: 0; }
  .divider::after { right: 0; }
</style>
</head>
<body>

<div class="container">
  <div class="logo">
    <span class="logo-symbol">⚜</span>
    <h1>YGOPRODeck</h1>
    <p>Card Collection Manager</p>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <div class="form active" id="login-form">
      <div class="error-msg" id="login-error"></div>
      <div class="field">
        <label>Username</label>
        <input type="text" id="login-username" placeholder="Enter your username" autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="Enter your password" autocomplete="current-password">
      </div>
      <button class="btn" id="login-btn" onclick="handleLogin()">Enter</button>
    </div>

    <!-- Register Form -->
    <div class="form" id="register-form">
      <div class="error-msg" id="register-error"></div>
      <div class="field">
        <label>Username</label>
        <input type="text" id="reg-username" placeholder="Choose a username">
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="reg-email" placeholder="your@email.com">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="reg-password" placeholder="At least 6 characters">
      </div>
      <button class="btn" id="register-btn" onclick="handleRegister()">Create Account</button>
    </div>
  </div>
</div>

<script>
  const API = '';

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
    document.querySelector(`.tab[onclick="switchTab('${tab}')"]`).classList.add('active');
    document.getElementById(`${tab}-form`).classList.add('active');
  }

  async function handleLogin() {
    const btn = document.getElementById('login-btn');
    const errEl = document.getElementById('login-error');
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;

    errEl.classList.remove('show');
    if (!username || !password) {
      errEl.textContent = 'Please fill in all fields.';
      errEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Entering...';

    try {
      const res = await fetch(`${API}/api/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');
      window.location.href = '/profile';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Enter';
    }
  }

  async function handleRegister() {
    const btn = document.getElementById('register-btn');
    const errEl = document.getElementById('register-error');
    const username = document.getElementById('reg-username').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;

    errEl.classList.remove('show');
    if (!username || !email || !password) {
      errEl.textContent = 'Please fill in all fields.';
      errEl.classList.add('show');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Creating...';

    try {
      const res = await fetch(`${API}/api/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ username, email, password })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Registration failed');
      window.location.href = '/profile';
    } catch (err) {
      errEl.textContent = err.message;
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Create Account';
    }
  }

  // Allow Enter key
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const loginActive = document.getElementById('login-form').classList.contains('active');
      if (loginActive) handleLogin();
      else handleRegister();
    }
  });

  // Check if already logged in
  (async () => {
    try {
      const res = await fetch(`${API}/api/auth/me`, { credentials: 'include' });
      if (res.ok) window.location.href = '/profile';
    } catch {}
  })();
</script>
</body>
</html>
